name: check
on:
  pull_request:
  push:
    branches:
      - main
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs_version:
          - 30.1
        ignore_warnings:
          - true
    steps:
      - uses: actions/checkout@v4

      - uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs_version }}

      - name: Lint
        uses: leotaku/elisp-check@master
        with:
          file: "org-todoist.el"
          ignore_warnings: false
          check: package-lint

      - name: Install dependencies
        run: |
          mkdir -p deps
          git clone --depth 1 https://github.com/magnars/dash.el deps/dash.el
          git clone --depth 1 https://github.com/magnars/s.el deps/s.el
          git clone --depth 1 https://github.com/alphapapa/ts.el deps/ts.el

      - name: Byte-compile
        run: make compile DEPS=deps

      - name: Test
        run: make test DEPS=deps
